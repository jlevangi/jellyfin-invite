<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Pierce's Media{% endblock %}</title>
  <meta name="theme-color" content="#08111f">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <script defer src="{{ url_for('static', filename='js/pwa.js') }}"></script>
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Pierce's Media</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% block nav %}<a class="btn secondary" href="/invite">Invite</a>{% endblock %}
    </nav>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
